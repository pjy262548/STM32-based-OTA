; PlatformIO Project Configuration
; Board: ZY-ESP32 DevKit V4 / ESP32 Dev Module compatible

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

upload_port = COM7
upload_speed = 115200
monitor_port = COM7
monitor_speed = 115200
monitor_filters = direct

; STM32 UART uses independent GPIOs.
; Wiring: STM32 PA2 -> ESP32 GPIO21, STM32 PA3 -> ESP32 GPIO22, GND -> GND.
; USB serial logs are available because STM32 is not using ESP32 GPIO1/GPIO3.
build_flags =
    -D USE_USB_RXTX_FOR_STM32=0
    -D UART_TX_PIN=22
    -D UART_RX_PIN=21
    -D REMOTE_LOG_ENABLE=0
    -D STM32_RX_PROBE_ENABLE=0
    -D UART_BAUD=115200
    -D CORE_DEBUG_LEVEL=0

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    knolleary/PubSubClient @ ^2.8

board_build.partitions = default.csv
